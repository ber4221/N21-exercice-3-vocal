<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Soustraction – fiche vocale tactile</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:#eef1f4;font-family:Arial,sans-serif;color:#24313f}
body{touch-action:manipulation}
.app{max-width:980px;margin:0 auto;padding:8px}
.hint{
  background:white;border-radius:12px;padding:9px 12px;margin-bottom:8px;
  font-size:13px;line-height:1.3;box-shadow:0 1px 5px rgba(0,0,0,.08)
}

.enable-mic{
  margin-top:8px;min-height:42px;padding:0 14px;border:0;border-radius:10px;
  background:#2e9f54;color:white;font-size:14px;font-weight:800;cursor:pointer
}
.enable-mic.active{background:#e7f6eb;color:#23723d;border:1px solid #79bd8e}
.enable-mic:disabled{opacity:.8;cursor:default}
.mic-state{margin-top:5px;font-size:12px;color:#667381}

.sheet-wrap{position:relative;width:100%;background:white;box-shadow:0 2px 12px rgba(0,0,0,.12)}
.sheet{display:block;width:100%;height:auto;user-select:none;-webkit-user-drag:none;pointer-events:none}

.answer-zone{
  position:absolute;z-index:10;margin:0;padding:0;border:2px solid transparent;border-radius:7px;
  background:transparent;display:flex;align-items:center;justify-content:center;
  appearance:none;-webkit-appearance:none;cursor:pointer;overflow:visible;
  pointer-events:auto;touch-action:manipulation;
  transition:background .12s,border-color .12s,box-shadow .12s;
}
.answer-zone.active{
  background:rgba(45,175,85,.28);
  border-color:#2e9f54;
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.65);
}
.answer-zone.validated{
  background:rgba(45,175,85,.13);
  border-color:#55ae70;
}
.answer-value{
  position:relative;z-index:2;font-weight:800;color:#4c4c4c;
  font-size:clamp(18px,4vw,48px);line-height:1;pointer-events:none;
}
.mic-button{
  display:none;position:absolute;z-index:20;width:44px;height:44px;border-radius:50%;
  align-items:center;justify-content:center;background:#fff;color:#19713a;
  font-size:22px;box-shadow:0 2px 8px rgba(0,0,0,.18);pointer-events:auto;
}
.answer-zone.active:not(.has-value) .mic-button{display:flex;background:#e8f7ed;color:#19713a}
.answer-zone.active.has-value .mic-button{
  display:flex;width:30px;height:30px;font-size:15px;left:3px;top:3px
}
.validate-button{
  display:none;position:absolute;z-index:20;width:30px;height:30px;border-radius:50%;
  align-items:center;justify-content:center;background:#29a34f;color:white;
  font-size:18px;font-weight:900;right:3px;bottom:3px;box-shadow:0 2px 7px rgba(0,0,0,.18);
  pointer-events:auto;
}
.answer-zone.active.has-value:not(.validated) .validate-button{display:flex}

.status{
  position:sticky;bottom:6px;z-index:20;margin-top:8px;padding:9px 12px;
  min-height:38px;border-radius:11px;background:rgba(255,255,255,.96);
  box-shadow:0 2px 10px rgba(0,0,0,.12);font-size:13px
}
.status.listening{background:#edf8f0;color:#176b35;font-weight:700}

.keypad-toggle{
  position:fixed;right:12px;bottom:12px;z-index:50;width:52px;height:52px;border:0;border-radius:14px;
  background:#263746;color:white;font-size:25px;box-shadow:0 4px 16px rgba(0,0,0,.25);cursor:pointer
}
.keypad{
  position:fixed;right:12px;bottom:72px;z-index:49;width:min(290px,calc(100vw - 24px));
  padding:10px;background:white;border:1px solid #d4d9df;border-radius:14px;
  box-shadow:0 6px 24px rgba(0,0,0,.25);display:none
}
.keypad.show{display:block}
.keypad-title{font-size:12px;font-weight:800;margin:0 0 8px;color:#536271}
.keys{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}
.keys button{
  min-height:48px;border:1px solid #c9d0d7;border-radius:10px;background:#f7f9fb;
  color:#24313f;font-size:20px;font-weight:800;cursor:pointer
}
.keys button.op{background:#eef5ff;color:#245fa6}
.keys button.equal{background:#2fa454;color:white;border-color:#2fa454}
.keys button:active{transform:scale(.97)}

@media(max-width:500px){
  .app{padding:3px}
  .hint{font-size:12px;padding:7px 9px;margin-bottom:4px}
  .answer-zone{border-width:2px;border-radius:5px}
  .mic-button{width:32px;height:32px;font-size:16px}
  .answer-zone.active.has-value .mic-button{width:24px;height:24px;font-size:12px}
  .validate-button{width:24px;height:24px;font-size:14px}
  .status{font-size:12px;padding:7px 9px}
}
</style>
</head>

<div class="keypad" id="keypad" aria-label="Pavé numérique">
  <div class="keypad-title">Pavé numérique</div>
  <div class="keys">
    <button type="button" data-key="1">1</button>
    <button type="button" data-key="2">2</button>
    <button type="button" data-key="3">3</button>
    <button type="button" class="op" data-key="+">+</button>

    <button type="button" data-key="4">4</button>
    <button type="button" data-key="5">5</button>
    <button type="button" data-key="6">6</button>
    <button type="button" class="op" data-key="-">−</button>

    <button type="button" data-key="7">7</button>
    <button type="button" data-key="8">8</button>
    <button type="button" data-key="9">9</button>
    <button type="button" class="equal" data-key="=">=</button>

    <button type="button" data-key="0" style="grid-column:2 / span 2">0</button>
  </div>

<script>
(function(){
  const zones = Array.from(document.querySelectorAll('.answer-zone'));
  const status = document.getElementById('status');
  const keypad = document.getElementById('keypad');
  const keypadToggle = document.getElementById('keypadToggle');
  const enableMic = document.getElementById('enableMic');
  const micState = document.getElementById('micState');
  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

  let active = null;
  let recognition = null;
  let freshEntry = true;
  let micReady = false;

  const words = {
    'zéro':0,'zero':0,'un':1,'une':1,'deux':2,'trois':3,'quatre':4,'cinq':5,
    'six':6,'sept':7,'huit':8,'neuf':9,'dix':10,'onze':11,'douze':12,
    'treize':13,'quatorze':14,'quinze':15,'seize':16,'dix-sept':17,
    'dix sept':17,'dix-huit':18,'dix huit':18,'dix-neuf':19,'dix neuf':19,'vingt':20
  };


  function activateMicrophoneOnce(){
    if(micReady){
      status.textContent='Le micro est déjà autorisé pour cette séance.';
      return;
    }

    if(!SpeechRecognition){
      micState.textContent='La reconnaissance vocale n’est pas disponible dans ce navigateur.';
      status.textContent='Utilisez le pavé numérique.';
      return;
    }

    try{
      const testRecognition = new SpeechRecognition();
      testRecognition.lang='fr-FR';
      testRecognition.interimResults=false;
      testRecognition.continuous=false;
      testRecognition.maxAlternatives=1;

      micState.textContent='Demande d’autorisation du micro…';
      status.textContent='Autorisez le microphone si Chrome le demande.';

      testRecognition.onstart=function(){
        micReady=true;
        enableMic.textContent='✓ Micro autorisé pour la séance';
        enableMic.classList.add('active');
        enableMic.disabled=true;
        micState.textContent='Autorisation obtenue. Touchez maintenant une case.';
        status.textContent='Micro prêt. Touchez une case pour dicter une réponse.';
        try{ testRecognition.abort(); }catch(e){}
      };

      testRecognition.onerror=function(ev){
        micReady=false;
        enableMic.disabled=false;
        enableMic.classList.remove('active');
        enableMic.textContent='🎤 Activer le micro pour la séance';

        if(ev.error==='not-allowed' || ev.error==='service-not-allowed'){
          micState.textContent='Autorisation du micro refusée.';
          status.textContent='Autorisez le microphone pour ce site dans Chrome.';
        }else{
          micState.textContent='Impossible d’activer le micro : '+ev.error;
          status.textContent='Réessayez ou utilisez le pavé numérique.';
        }
      };

      testRecognition.start();
    }catch(err){
      micState.textContent='Impossible de démarrer la reconnaissance vocale.';
      status.textContent='Réessayez ou utilisez le pavé numérique.';
    }
  }

  enableMic.addEventListener('click', activateMicrophoneOnce);

  function normalize(s){
    return String(s||'').toLowerCase().trim().replace(/[.,;:!?]/g,'').replace(/\s+/g,' ');
  }

  function parseSpeech(s){
    let t = normalize(s);
    let sign = 1;
    let explicitMinus = false;
    let explicitPlus = false;

    if(t.startsWith('moins ')){
      sign = -1;
      explicitMinus = true;
      t = t.slice(6).trim();
    }else if(t.startsWith('plus ')){
      explicitPlus = true;
      t = t.slice(5).trim();
    }

    const m=t.match(/-?\d+/);
    if(m){
      let n=parseInt(m[0],10);
      if(sign<0 && n>0)n=-n;
      return Number.isFinite(n)
        ? { value:n, explicitMinus, explicitPlus }
        : null;
    }

    if(Object.prototype.hasOwnProperty.call(words,t)){
      return {
        value: sign*words[t],
        explicitMinus,
        explicitPlus
      };
    }

    return null;
  }

  function getValueEl(z){return z.querySelector('.answer-value')}
  function getCurrent(z){
    const s=z.dataset.value||'';
    return s;
  }
  function setCurrent(z,s){
    z.dataset.value=String(s);
    getValueEl(z).textContent=String(s).replace('-', '−');
    z.classList.toggle('has-value', String(s)!=='');
    z.classList.remove('validated');
  }

  function activate(z){
    zones.forEach(other=>{ if(other!==z) other.classList.remove('active'); });
    active=z;
    z.classList.add('active');
    z.classList.remove('validated');
    freshEntry=true;
    status.classList.remove('listening');
    const typeText =
      z.dataset.sign === 'negative'
        ? 'quantité retirée : le signe − sera ajouté automatiquement'
        : 'nombre de départ';

    status.textContent=
      z.dataset.sign === 'negative'
        ? 'Case '+z.dataset.zone+' active. Dis le nombre AVEC son signe, par exemple « moins trois ».'
        : 'Case '+z.dataset.zone+' active. Dis le nombre de départ, par exemple « cinq ».';
  }

  function validateActive(){
    if(!active)return;
    const v=getCurrent(active);
    if(v==='' || v==='+' || v==='-'){
      status.textContent='Entrez d’abord un nombre.';
      return;
    }

    if(
      active.dataset.sign === 'negative' &&
      !v.startsWith('-')
    ){
      status.textContent='⚠ N’oublie pas le signe − avant le nombre.';
      return;
    }

    active.classList.remove('active');
    active.classList.add('validated');
    freshEntry=true;
    status.classList.remove('listening');
    status.textContent='✓ Réponse '+v+' validée.';
    active=null;
  }

  function startListening(z){
    activate(z);

    if(!micReady){
      status.textContent='Active d’abord le micro pour la séance avec le bouton en haut.';
      return;
    }

    if(!SpeechRecognition){
      status.textContent='La reconnaissance vocale n’est pas disponible. Utilisez le pavé numérique.';
      keypad.classList.add('show');
      return;
    }

    if(recognition){
      try{ recognition.abort(); }catch(e){}
    }

    recognition = new SpeechRecognition();
    recognition.lang='fr-FR';
    recognition.interimResults=false;
    recognition.continuous=false;
    recognition.maxAlternatives=5;

    recognition.onaudiostart=function(){
      status.classList.add('listening');
      status.textContent=
        z.dataset.sign === 'negative'
          ? '🎤 Micro actif… dites « moins trois » par exemple.'
          : '🎤 Micro actif… dites « cinq » par exemple.';
    };

    recognition.onspeechstart=function(){
      status.classList.add('listening');
      status.textContent='🎤 Voix détectée…';
    };

    recognition.onresult=function(ev){
      const result=ev.results[0];
      let parsed=null;
      let entendu='';

      for(let i=0;i<result.length;i++){
        entendu=result[i].transcript;
        parsed=parseSpeech(entendu);

        if(parsed!==null){
          if(z.dataset.sign !== 'negative' || parsed.explicitMinus){
            break;
          }
        }
      }

      status.classList.remove('listening');

      if(parsed===null){
        status.textContent='Je n’ai pas compris le nombre. Réessayez.';
        return;
      }

      if(z.dataset.sign === 'negative' && !parsed.explicitMinus){
        setCurrent(z,'');
        status.textContent='⚠ N’oublie pas le signe : dis « moins trois », et pas seulement « trois ».';
        return;
      }

      const signedValue =
        z.dataset.sign === 'negative'
          ? -Math.abs(parsed.value)
          : Math.abs(parsed.value);

      setCurrent(z,String(signedValue));
      freshEntry=true;
      status.textContent='Entendu : « '+entendu+' » → '+signedValue+'. Touchez ✓ pour valider.';
    };

    recognition.onerror=function(ev){
      status.classList.remove('listening');

      if(ev.error==='no-speech'){
        status.textContent='Je n’ai pas entendu de voix. Touchez de nouveau le micro et réessayez.';
      }else if(ev.error==='not-allowed' || ev.error==='service-not-allowed'){
        micReady=false;
        enableMic.disabled=false;
        enableMic.classList.remove('active');
        enableMic.textContent='🎤 Réactiver le micro';
        micState.textContent='Chrome a bloqué le microphone.';
        status.textContent='Réautorisez le microphone pour ce site.';
      }else{
        status.textContent='Erreur micro : '+ev.error+'. Réessayez.';
      }
    };

    recognition.onend=function(){
      status.classList.remove('listening');
    };

    try{
      recognition.start();
    }catch(err){
      status.classList.remove('listening');
      status.textContent='Impossible de démarrer l’écoute. Réessayez.';
    }
  }

  zones.forEach(z=>{
    let lastTouch = 0;

    function handleZoneTap(e){
      if(e){
        e.preventDefault();
        e.stopPropagation();
      }

      const rect=z.getBoundingClientRect();
      const clientX =
        e && e.clientX !== undefined
          ? e.clientX
          : rect.left + rect.width/2;
      const clientY =
        e && e.clientY !== undefined
          ? e.clientY
          : rect.top + rect.height/2;

      const x=clientX-rect.left;
      const y=clientY-rect.top;

      // Coin gauche/haut : micro si une valeur existe déjà.
      if(z.classList.contains('active') && z.classList.contains('has-value') && x<38 && y<38){
        startListening(z);
        return;
      }

      // Coin droit/bas : validation.
      if(z.classList.contains('active') && z.classList.contains('has-value') && x>rect.width-38 && y>rect.height-38){
        validateActive();
        return;
      }

      if(micReady){
        startListening(z);
      }else{
        activate(z);
        status.textContent='Case active. Active le micro pour la séance avec le bouton en haut, ou utilise le pavé.';
      }
    }

    if(window.PointerEvent){
      z.addEventListener('pointerup', handleZoneTap, {passive:false});
    }else{
      z.addEventListener('touchend', function(e){
        lastTouch=Date.now();
        handleZoneTap(e.changedTouches && e.changedTouches[0] ? e.changedTouches[0] : e);
      }, {passive:false});

      z.addEventListener('click', function(e){
        if(Date.now()-lastTouch < 700) return;
        handleZoneTap(e);
      });
    }
  });

  keypadToggle.addEventListener('click',()=>{
    keypad.classList.toggle('show');
    if(!active) status.textContent='Touchez d’abord une case, puis utilisez le pavé.';
  });

  keypad.querySelectorAll('button[data-key]').forEach(btn=>{
    btn.addEventListener('click',()=>{
      if(!active){
        status.textContent='Touchez d’abord une case.';
        return;
      }
      const key=btn.dataset.key;
      if(key==='='){
        const cur=getCurrent(active);

        if(
          active.dataset.sign === 'negative' &&
          cur !== '' &&
          !cur.startsWith('-')
        ){
          status.textContent='⚠ N’oublie pas le signe − avant le nombre.';
          return;
        }

        validateActive();
        return;
      }

      let cur=getCurrent(active);

      if(key==='+' || key==='-'){
        const digits=cur.replace(/^[-+]/,'');
        cur=(key==='-'?'-':'+')+digits;
        freshEntry=false;
      }else{
        if(freshEntry || cur==='+' || cur==='-'){
          const sign=(cur==='-'?'-':cur==='+'?'+':'');
          cur=sign+key;
          freshEntry=false;
        }else{
          const sign=cur.startsWith('-')?'-':cur.startsWith('+')?'+':'';
          let digits=cur.replace(/^[-+]/,'');
          if(digits==='0') digits=key;
          else digits+=key;
          cur=sign+digits;
        }
      }

      setCurrent(active,cur);
      status.textContent='Réponse : '+cur.replace('+','+').replace('-','−')+'. Appuyez sur = ou ✓ pour valider.';
    });
  });
})();
</script>
